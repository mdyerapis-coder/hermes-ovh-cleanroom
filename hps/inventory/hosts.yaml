# Authoritative HPS host inventory (identity and roles only; no secrets)
hosts:
  hermes-ovh-cleanroom:
    environment: cleanroom
    roles: [control_plane, hermes_runtime, hps_authority]
    expected_hostname: hermes-ovh-cleanroom
    release_root: /opt/hermes-cleanroom
    tailscale_name: hermes-ovh-cleanroom
    mutation_allowed: true
    notes: Default clean-room mutation host and future production ownership target
  hermes-station-1:
    environment: production
    roles: [legacy_production]
    expected_hostname: hermes-station-1
    release_root: PENDING_VERIFICATION
    tailscale_name: hermes-station-1
    mutation_allowed: false
    notes: Read-only until HPS cutover reaches ARMED with valid local arm transaction
environments:
  cleanroom:
    default_host: hermes-ovh-cleanroom
    mutation_policy: allowed_with_plan
  production:
    default_host: hermes-station-1
    mutation_policy: blocked_until_armed
  rollback:
    default_host: hermes-station-1
    mutation_policy: blocked_until_armed
  test:
    default_host: hermes-ovh-cleanroom
    mutation_policy: allowed_with_plan
