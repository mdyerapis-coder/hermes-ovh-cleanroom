# Secret names and purpose only — never values
secrets:
  TELEGRAM_BOT_TOKEN:
    owner: hermes-gateway
    required: false
    external_exclusive: true
    purpose: Telegram bot token; production token must not double-poll
  OPENAI_API_KEY:
    owner: hermes-agent
    required: false
    external_exclusive: false
    purpose: Optional OpenAI provider credential
  ANTHROPIC_API_KEY:
    owner: hermes-agent
    required: false
    external_exclusive: false
    purpose: Optional Anthropic provider credential
  XAI_API_KEY:
    owner: hermes-agent
    required: false
    external_exclusive: false
    purpose: Optional xAI provider credential
  POSTGRES_PASSWORD:
    owner: postgres
    required: false
    external_exclusive: false
    purpose: Database password when postgres is deployed
  N8N_ENCRYPTION_KEY:
    owner: n8n
    required: false
    external_exclusive: false
    purpose: n8n encryption key when n8n is deployed
  BACKUP_ENCRYPTION_KEY:
    owner: backup
    required: true
    external_exclusive: false
    purpose: Symmetric key for local backup encryption
  TAILSCALE_AUTHKEY:
    owner: deploy
    required: false
    external_exclusive: true
    purpose: Optional CI Tailscale auth; prefer workload identity
  GHCR_TOKEN:
    owner: deploy
    required: false
    external_exclusive: true
    purpose: Optional registry push/pull for deployment images

bootstrap_only:
  - GITHUB_TOKEN
  - TAILSCALE_AUTHKEY
