# Clean-room supporting services — private binds only
# Images pinned; never use latest for production deploy
name: hermes-cleanroom

services:
  postgres:
    image: postgres:16.4
    profiles: ["datastores"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_DB: hermes
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hermes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: false
    user: "999:999"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    profiles: ["datastores"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - hermes_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
    # file is local runtime only; never commit real values

volumes:
  hermes_pg:
  hermes_qdrant:
